<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VillCoin Premium</title>
    <!-- Подключаем шрифты для дорогого вида -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff88;
            --deep-green: #004d2c;
            --dark-bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.07);
            --ios-blur: blur(20px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* --- ФОНОВЫЕ ЭФФЕКТЫ --- */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.05) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        /* --- ШАПКА И БАЛАНС --- */
        .header {
            margin-top: 60px;
            text-align: center;
            z-index: 10;
        }

        #score-container {
            position: relative;
            display: inline-block;
        }

        #score {
            font-family: 'Montserrat', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(180deg, #FFFFFF 40%, var(--neon-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 255, 136, 0.3));
            transition: transform 0.1s ease;
        }

        .currency-name {
            color: var(--neon-green);
            font-weight: 800;
            letter-spacing: 5px;
            font-size: 1rem;
            margin-top: -10px;
            opacity: 0.9;
            text-transform: uppercase;
        }

        /* --- ИГРОВАЯ ЗОНА --- */
        #game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }

        .coin-base {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Анимированное свечение под монетой */
        .coin-outer-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse-glow 3s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.15); opacity: 0.6; }
        }

        #main-coin {
            width: 270px;
            height: 270px;
            background: radial-gradient(circle at 35% 35%, #1a1a1a 0%, #000 100%);
            border-radius: 50%;
            border: 6px solid #111;
            box-shadow: 
                0 0 0 2px rgba(0, 255, 136, 0.1),
                0 20px 50px rgba(0, 0, 0, 0.9),
                inset 0 0 30px rgba(0, 255, 136, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.05s cubic-bezier(0, 0, 0.2, 1);
        }

        #main-coin::before {
            content: "V";
            font-family: 'Montserrat', sans-serif;
            font-size: 110px;
            color: var(--neon-green);
            text-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
            font-weight: 900;
        }

        /* --- ТАП-ЭФФЕКТ (+1) --- */
        .floating-value {
            position: absolute;
            color: white;
            font-weight: 800;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 100;
            animation: float-up 0.7s ease-out forwards;
            text-shadow: 0 0 10px var(--neon-green);
        }

        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-180px) scale(1.3); opacity: 0; }
        }

        /* --- НИЖНЯЯ ПАНЕЛЬ (iOS STYLE) --- */
        .bottom-nav {
            width: 92%;
            background: var(--glass);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            padding: 12px;
            margin-bottom: 40px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .nav-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: none;
            border-radius: 25px;
            padding: 15px 0;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: 0.3s;
        }

        .nav-btn:active {
            background: rgba(0, 255, 136, 0.1);
            transform: scale(0.94);
        }

        .nav-btn .icon { font-size: 1.4rem; }
        .nav-btn span { font-size: 0.75rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; }

        /* --- ПРЕМИУМ ПАНЕЛИ (ВМЕСТО АЛЕРТОВ) --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: 0.3s;
        }

        .sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: #111;
            border-top: 2px solid var(--neon-green);
            border-radius: 40px 40px 0 0;
            padding: 40px 25px 50px 25px;
            z-index: 1001;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        .sheet.active { bottom: 0; }
        .overlay.active { display: block; opacity: 1; }

        .sheet-title {
            font-size: 2rem;
            color: var(--neon-green);
            margin: 0 0 15px 0;
            font-family: 'Montserrat';
        }

        .sheet-text {
            color: #aaa;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .sheet-close {
            background: white;
            color: black;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 800;
        }

        /* ПРИВЕТСТВЕННЫЙ ЭКРАН */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 5000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .start-card {
            width: 85%;
            text-align: center;
            background: #0a0a0a;
            padding: 40px 25px;
            border-radius: 40px;
            border: 1px solid #1a1a1a;
        }

        .start-card h2 { color: var(--neon-green); font-size: 2.2rem; margin-bottom: 10px; font-family: 'Montserrat'; }
        .start-btn {
            margin-top: 30px;
            background: var(--neon-green);
            color: black;
            padding: 20px;
            border-radius: 20px;
            font-weight: 900;
            display: block;
            text-decoration: none;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- ЭКРАН ПРИ ВХОДЕ -->
    <div id="start-screen">
        <div class="start-card">
            <h2>VILL COIN</h2>
            <p style="color: #666;">Самый быстрый кликер в твоем селе. Собирай монеты и жди дроп!</p>
            <a href="#" class="start-btn" onclick="startGame()">НАЧАТЬ МАЙНИНГ</a>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="header">
        <div id="score-container">
            <h1 id="score">0</h1>
        </div>
        <div class="currency-name">$VILL COINS</div>
    </div>

    <div id="game-container">
        <div class="coin-base">
            <div class="coin-outer-glow"></div>
            <div id="main-coin"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn" onclick="showSheet('shop')">
            <div class="icon">💎</div>
            <span>Магазин</span>
        </button>
        <button class="nav-btn" onclick="showSheet('ads')">
            <div class="icon">🚀</div>
            <span>Реклама</span>
        </button>
        <button class="nav-btn" onclick="showSheet('info')">
            <div class="icon">📈</div>
            <span>Инфо</span>
        </button>
    </div>

    <!-- КАСТОМНЫЕ ПАНЕЛИ (ВМЕСТО СЕРЫХ ОКОШЕК) -->
    <div id="overlay" class="overlay" onclick="hideSheet()"></div>
    <div id="sheet" class="sheet">
        <h2 id="sheet-h" class="sheet-title">Заголовок</h2>
        <p id="sheet-p" class="sheet-text">Описание...</p>
        <button class="sheet-close" onclick="hideSheet()">ПОНЯТНО</button>
    </div>

    <script>
        // --- СИСТЕМА СОХРАНЕНИЯ (РАБОТАЕТ НА ТВОЕМ LENOVO) ---
        let balance = parseInt(localStorage.getItem('v_bal')) || 0;
        let totalClicks = parseInt(localStorage.getItem('v_total')) || 0;
        
        const scoreDisplay = document.getElementById('score');
        scoreDisplay.innerText = balance.toLocaleString();

        function startGame() {
            document.getElementById('start-screen').style.transition = '0.8s';
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
            }, 800);
        }

        // --- ЛОГИКА КЛИКА ---
        const coin = document.getElementById('main-coin');
        
        function processClick(e) {
            e.preventDefault();
            
            balance++;
            totalClicks++;
            
            // Обновляем экран
            scoreDisplay.innerText = balance.toLocaleString();
            
            // Сохраняем в память браузера
            localStorage.setItem('v_bal', balance);
            localStorage.setItem('v_total', totalClicks);

            // Анимация нажатия
            coin.style.transform = 'scale(0.9) translateY(8px)';
            setTimeout(() => coin.style.transform = 'scale(1) translateY(0)', 50);

            // Эффект вылетающей цифры
            const x = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const y = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            showFloatText(x, y);

            // Вибрация (для мобилок)
            if (navigator.vibrate) navigator.vibrate(20);
        }

        coin.addEventListener('touchstart', processClick);
        coin.addEventListener('mousedown', (e) => { if(e.button === 0) processClick(e); });

        function showFloatText(x, y) {
            const txt = document.createElement('div');
            txt.className = 'floating-value';
            txt.innerText = '+1';
            txt.style.left = `${x - 20}px`;
            txt.style.top = `${y - 40}px`;
            document.body.appendChild(txt);
            setTimeout(() => txt.remove(), 700);
        }

        // --- УПРАВЛЕНИЕ ПРЕМИУМ-ПАНЕЛЯМИ ---
        const overlay = document.getElementById('overlay');
        const sheet = document.getElementById('sheet');
        const sheetH = document.getElementById('sheet-h');
        const sheetP = document.getElementById('sheet-p');

        function showSheet(type) {
            if (type === 'shop') {
                sheetH.innerText = "Магазин";
                sheetP.innerText = "Улучшения (авто-кликер и мульти-тап) сейчас в разработке. Твои монеты сохраняются, копи их для покупки бустов в версии 2.0!";
            } else if (type === 'ads') {
                sheetH.innerText = "Реклама";
                sheetP.innerText = "Хочешь продвинуть свой канал или проект? Связь с владельцем: @VillCoin_Manager. Цены для своих — копейки.";
            } else if (type === 'info') {
                sheetH.innerText = "Твоя Статистика";
                sheetP.innerText = `Всего сделано тапов: ${totalClicks}\nТекущий баланс: ${balance} $VILL\n\nПрогресс надежно сохранен в памяти устройства.`;
            }
            
            overlay.classList.add('active');
            sheet.classList.add('active');
        }

        function hideSheet() {
            overlay.classList.remove('active');
            sheet.classList.remove('active');
        }

        // --- СЕКРЕТНЫЙ АДМИН-РЕЖИМ (1505) ---
        let tapSeq = 0;
        scoreDisplay.parentElement.onclick = () => {
            tapSeq++;
            if(tapSeq >= 5) {
                let code = prompt("Введите код доступа:");
                if(code === "1505") {
                    let bonus = prompt("Сколько начислить?");
                    balance += parseInt(bonus) || 0;
                    scoreDisplay.innerText = balance.toLocaleString();
                    localStorage.setItem('v_bal', balance);
                }
                tapSeq = 0;
            }
            setTimeout(() => tapSeq = 0, 2000);
        };
    </script>
</body>
</html>
