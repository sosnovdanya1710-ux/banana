<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Banana Tap Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1012;
            --card-bg: #1c1d21;
            --accent-color: #f3ba2f;
            --text-main: #ffffff;
            --text-secondary: #8e8e93;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-block {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 5px 12px;
            border-radius: 20px;
        }

        .balance-block {
            background: var(--card-bg);
            padding: 5px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(243, 186, 47, 0.3);
        }

        .click-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #banana {
            width: 250px;
            filter: drop-shadow(0 0 40px rgba(243, 186, 47, 0.2));
            transition: transform 0.05s ease;
            z-index: 2;
            cursor: pointer;
        }

        #banana:active { transform: scale(0.92); }

        .tap-effect {
            position: absolute;
            color: var(--accent-color);
            font-size: 32px;
            font-weight: bold;
            pointer-events: none;
            animation: fly 0.8s ease-out forwards;
            z-index: 10;
        }

        @keyframes fly {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-150px) scale(1.5); }
        }

        .footer-nav {
            background: #16171b;
            display: flex;
            justify-content: space-around;
            padding: 15px 10px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-secondary);
            font-size: 10px;
        }

        .nav-btn.active { color: var(--accent-color); }

        .nav-icon {
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-block">
            <div style="width:24px;height:24px;background:#4a4a4a;border-radius:50%;text-align:center;font-size:12px;line-height:24px;">U</div>
            <span id="user-name">User</span>
        </div>
        <div class="balance-block">
            <span style="color: var(--accent-color)">★</span>
            <span id="score">0</span>
        </div>
    </div>

    <div class="click-area" id="touch-zone">
        <img id="banana" src="https://www.pngall.com/wp-content/uploads/11/Banana-No-Background.png" alt="Banana">
    </div>

    <div class="footer-nav">
        <div class="nav-btn"><span>Промо</span></div>
        <div class="nav-btn"><span>Реф</span></div>
        <div class="nav-btn active"><span>Кейсы</span></div>
        <div class="nav-btn"><span>Задания</span></div>
        <div class="nav-btn"><span>Профиль</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let count = 0;
        const scoreEl = document.getElementById('score');
        const userName = tg.initDataUnsafe?.user?.first_name || "User";
        document.getElementById('user-name').innerText = userName;

        document.getElementById('touch-zone').addEventListener('touchstart', (e) => {
            e.preventDefault();
            count++;
            scoreEl.innerText = count;

            // Та самая вибрация
            tg.HapticFeedback.impactOccurred('medium');

            const touch = e.touches[0];
            const p = document.createElement('div');
            p.className = 'tap-effect';
            p.innerText = '+1';
            p.style.left = touch.pageX + 'px';
            p.style.top = touch.pageY + 'px';
            document.body.appendChild(p);

            setTimeout(() => p.remove(), 800);
        });
    </script>
</body>
</html>
