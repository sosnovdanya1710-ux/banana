<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VillCoin: Infinity Listing</title>
    
    <!-- Подключаем шрифты для премиального вида -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ЦВЕТОВ --- */
        :root {
            --neon-green: #00ff88;
            --dark-green: #00331c;
            --bg-black: #020202;
            --card-gray: #0f0f11;
            --text-gray: #8e8e93;
            --ios-blue: #007aff;
            --xp-purple: #a100ff;
            --energy-yellow: #ffcc00;
        }

        /* --- СБРОС СТИЛЕЙ --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-black);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- АНИМИРОВАННЫЙ ФОН --- */
        .bg-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #0a1f14 0%, #020202 100%);
            z-index: -2;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 80%;
            height: 60%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.08) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: blur(50px);
            pointer-events: none;
        }

        /* --- ЭКРАН ПОДПИСКИ (ЗАЩИТА) --- */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-gray);
            border: 2px solid var(--neon-green);
            border-radius: 40px;
            padding: 40px 30px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.2);
        }

        .auth-card h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            color: var(--neon-green);
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .auth-btn {
            display: block;
            background: white;
            color: black;
            padding: 20px;
            border-radius: 20px;
            font-weight: 900;
            text-decoration: none;
            margin: 25px 0 15px 0;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .verify-btn {
            width: 100%;
            background: var(--neon-green);
            color: black;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ (ПРОФИЛЬ) --- */
        .top-status {
            width: 90%;
            margin-top: 50px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .stat-value {
            display: block;
            font-size: 0.95rem;
            color: var(--neon-green);
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }

        /* --- БАЛАНС --- */
        .balance-section {
            margin-top: 30px;
            text-align: center;
            z-index: 5;
        }

        #main-balance {
            font-family: 'Montserrat', sans-serif;
            font-size: 5.5rem;
            font-weight: 900;
            background: linear-gradient(180deg, #FFFFFF 30%, var(--neon-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.3));
            margin: 0;
        }

        .xp-bar-container {
            width: 200px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 10px auto;
            overflow: hidden;
        }

        #xp-progress {
            height: 100%;
            width: 0%;
            background: var(--xp-purple);
            box-shadow: 0 0 10px var(--xp-purple);
            transition: width 0.3s;
        }

        /* --- ИГРОВАЯ ЗОНА (МОНЕТА) --- */
        #game-click-area {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 100; /* Самый высокий приоритет для тапов */
        }

        .coin-container {
            position: relative;
            width: 310px;
            height: 310px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cd-ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(0, 255, 136, 0.05);
            border-radius: 50%;
        }

        #coin-object {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle at 35% 35%, #2a2a2a 0%, #000000 100%);
            border-radius: 50%;
            border: 6px solid #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 0 0 4px rgba(0, 255, 136, 0.05),
                0 30px 60px rgba(0, 0, 0, 1),
                inset 0 0 40px rgba(0, 255, 136, 0.1);
            transition: transform 0.05s cubic-bezier(0, 0, 0.2, 1);
            position: relative;
            z-index: 101;
            touch-action: manipulation;
        }

        #coin-object::before {
            content: "V";
            font-family: 'Montserrat', sans-serif;
            font-size: 120px;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 40px rgba(0, 255, 136, 0.6);
        }

        /* Энергия */
        .energy-box {
            margin-top: 30px;
            width: 250px;
            text-align: center;
        }

        .energy-label {
            font-size: 0.8rem;
            color: #666;
            font-weight: 900;
            margin-bottom: 8px;
            display: block;
        }

        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background: #111;
            border-radius: 20px;
            border: 1px solid #222;
            overflow: hidden;
        }

        #energy-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ffcc00, #ff9500);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
            transition: width 0.1s;
        }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-nav-bar {
            width: 94%;
            background: rgba(15, 15, 17, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 35px;
            display: flex;
            padding: 10px;
            margin-bottom: 40px;
            gap: 10px;
            z-index: 500;
        }

        .nav-button {
            flex: 1;
            padding: 15px 0;
            border-radius: 25px;
            border: none;
            background: transparent;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }

        .nav-button:active {
            background: rgba(0, 255, 136, 0.1);
            transform: scale(0.92);
        }

        .nav-button .nav-icon { font-size: 1.5rem; }
        .nav-button span {
            font-size: 0.65rem;
            font-weight: 800;
            color: #666;
            text-transform: uppercase;
        }

        /* --- МОДАЛЬНЫЕ ОКНА (UI) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            transition: 0.3s;
        }

        .modal-window {
            width: 100%;
            background: var(--card-gray);
            border-top: 3px solid var(--neon-green);
            border-radius: 45px 45px 0 0;
            padding: 40px 25px 60px 25px;
            transform: translateY(100%);
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active { display: flex; }
        .modal-overlay.active .modal-window { transform: translateY(0); }

        .modal-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            color: var(--neon-green);
            margin-bottom: 25px;
        }

        .upgrade-item {
            background: #1c1c1e;
            padding: 20px;
            border-radius: 30px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2c2c2e;
        }

        .up-text h5 { font-size: 1.1rem; margin-bottom: 5px; }
        .up-text p { font-size: 0.8rem; color: #666; }

        .buy-action {
            background: var(--neon-green);
            color: black;
            border: none;
            padding: 12px 18px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 0.9rem;
        }

        .buy-action:disabled {
            background: #333;
            color: #555;
        }

        /* --- ЭФФЕКТЫ --- */
        .tap-pop {
            position: absolute;
            pointer-events: none;
            font-weight: 900;
            color: white;
            font-size: 2.5rem;
            font-family: 'Montserrat';
            animation: moveUpFade 0.8s ease-out forwards;
            z-index: 1000;
            text-shadow: 0 0 10px var(--neon-green);
        }

        @keyframes moveUpFade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
        }

        #gift-popup {
            position: fixed;
            top: 120px;
            right: 20px;
            background: var(--neon-green);
            color: black;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            z-index: 500;
            animation: bounce 1s infinite alternate;
            border: 4px solid white;
        }

        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="bg-stars"></div>
    <div class="bg-glow"></div>

    <!-- БЛОКИРОВКА ПОДПИСКИ -->
    <div id="auth-screen">
        <div class="auth-card">
            <h1>$VILL COIN</h1>
            <p style="color: #666; font-size: 0.9rem;">Чтобы получить доступ к листингу и начать фармить $VILL, необходимо вступить в сообщество.</p>
            <a href="https://t.me/VillCoin" target="_blank" class="auth-btn" onclick="setClicked()">1. ВСТУПИТЬ В КАНАЛ</a>
            <button class="verify-btn" onclick="verifyAccess()">2. ПОДТВЕРДИТЬ</button>
        </div>
    </div>

    <!-- ВЕРХНИЙ СТАТУС -->
    <div class="top-status">
        <div class="user-info">
            <span class="stat-label">Время в игре</span>
            <b id="display-time" class="stat-value">00:00:00</b>
        </div>
        <div class="user-info" style="text-align: right;">
            <span class="stat-label">Уровень аккаунта</span>
            <b id="display-lv" class="stat-value">LVL 1</b>
        </div>
    </div>

    <!-- БАЛАНС -->
    <div class="balance-section">
        <h2 id="main-balance">0</h2>
        <div style="color: var(--neon-green); font-weight: 800; letter-spacing: 5px; font-size: 0.9rem; margin-top: -10px;">$VILL COINS</div>
        <div class="xp-bar-container">
            <div id="xp-progress"></div>
        </div>
    </div>

    <!-- ГИФТ -->
    <div id="gift-popup" onclick="collectGift()">🎁</div>

    <!-- ЦЕНТРАЛЬНАЯ КЛИК-ЗОНА -->
    <div id="game-click-area">
        <div class="coin-container">
            <div class="cd-ring-outer"></div>
            <div id="coin-object"></div>
        </div>

        <div class="energy-box">
            <span class="energy-label">ЭНЕРГИЯ: <span id="energy-val">1000</span> / 1000</span>
            <div class="energy-bar-bg">
                <div id="energy-fill"></div>
            </div>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="bottom-nav-bar">
        <button class="nav-button" onclick="openModal('shop')">
            <div class="nav-icon">⚒️</div>
            <span>Магазин</span>
        </button>
        <button class="nav-button" onclick="openModal('tasks')">
            <div class="nav-icon">🏆</div>
            <span>Задания</span>
        </button>
        <button class="nav-button" onclick="openModal('collab')">
            <div class="nav-icon">📱</div>
            <span>Сотрудничество</span>
        </button>
    </div>

    <!-- УНИВЕРСАЛЬНОЕ МОДАЛЬНОЕ ОКНО -->
    <div id="modal-overlay" class="modal-overlay" onclick="closeModal()">
        <div id="modal-window" class="modal-window" onclick="event.stopPropagation()">
            <h3 id="modal-title" class="modal-title">Магазин</h3>
            <div id="modal-content">
                <!-- Контент генерируется через JS -->
            </div>
            <button class="verify-btn" style="margin-top: 25px; background: #222; color: white;" onclick="closeModal()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        /* --- ИГРОВЫЕ ДАННЫЕ (СОХРАНЕНИЕ НА LENOVO) --- */
        let gameState = {
            balance: parseInt(localStorage.getItem('vill_bal')) || 0,
            level: parseInt(localStorage.getItem('vill_lvl')) || 1,
            xp: parseInt(localStorage.getItem('vill_xp')) || 0,
            clickPower: parseInt(localStorage.getItem('vill_cp')) || 1,
            autoPower: parseInt(localStorage.getItem('vill_ap')) || 0,
            energy: parseInt(localStorage.getItem('vill_en')) || 1000,
            maxEnergy: 1000,
            playTime: parseInt(localStorage.getItem('vill_time')) || 0,
            isSubbed: localStorage.getItem('vill_auth') === 'true'
        };

        const scoreDisplay = document.getElementById('main-balance');
        const energyFill = document.getElementById('energy-fill');
        const energyVal = document.getElementById('energy-val');
        const xpProgress = document.getElementById('xp-progress');
        const lvDisplay = document.getElementById('display-lv');
        const timeDisplay = document.getElementById('display-time');

        // Инициализация
        if(gameState.isSubbed) document.getElementById('auth-screen').style.display = 'none';
        updateUI();

        /* --- СИСТЕМА ПРОВЕРКИ --- */
        function setClicked() { localStorage.setItem('clicked_tg', 'true'); }
        function verifyAccess() {
            if(localStorage.getItem('clicked_tg') === 'true') {
                gameState.isSubbed = true;
                localStorage.setItem('vill_auth', 'true');
                document.getElementById('auth-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('auth-screen').style.display = 'none', 500);
            } else {
                alert("Ошибка! Вы не подписались на канал.");
            }
        }

        /* --- ГЛАВНЫЙ ЦИКЛ (1 РАЗ В СЕКУНДУ) --- */
        setInterval(() => {
            // Время
            gameState.playTime++;
            updateTime();

            // Авто-майнинг
            if(gameState.autoPower > 0) {
                gameState.balance += gameState.autoPower;
                addXP(gameState.autoPower * 0.1);
                updateUI();
            }

            // Регенерация энергии
            if(gameState.energy < gameState.maxEnergy) {
                gameState.energy += 2;
                if(gameState.energy > gameState.maxEnergy) gameState.energy = gameState.maxEnergy;
                updateEnergyUI();
            }

            // Шанс на гифт (раз в 2 минуты)
            if(gameState.playTime % 120 === 0) {
                document.getElementById('gift-popup').style.display = 'flex';
            }

            if(gameState.playTime % 5 === 0) saveGame();
        }, 1000);

        /* --- ЛОГИКА КЛИКА --- */
        const coin = document.getElementById('coin-object');
        
        function handleTap(e) {
            e.preventDefault();
            if(gameState.energy < gameState.clickPower) return;

            // Расчет координат
            let touch = e.type === 'touchstart' ? e.touches[0] : e;
            
            // Логика
            gameState.balance += gameState.clickPower;
            gameState.energy -= gameState.clickPower;
            addXP(gameState.clickPower);

            // Визуал
            spawnTapText(touch.clientX, touch.clientY);
            coin.style.transform = 'scale(0.9) translateY(10px)';
            setTimeout(() => coin.style.transform = 'scale(1) translateY(0)', 50);
            
            if(navigator.vibrate) navigator.vibrate(25);
            updateUI();
        }

        coin.addEventListener('touchstart', handleTap);
        coin.addEventListener('mousedown', (e) => { if(e.button === 0) handleTap(e); });

        /* --- СИСТЕМА XP И УРОВНЕЙ --- */
        function addXP(amount) {
            gameState.xp += amount;
            let nextLevelXP = gameState.level * 500;
            if(gameState.xp >= nextLevelXP) {
                gameState.level++;
                gameState.xp = 0;
                alert(`LEVEL UP! Теперь ты LVL ${gameState.level}`);
            }
            updateXPUI();
        }

        /* --- UI ОБНОВЛЕНИЯ --- */
        function updateUI() {
            scoreDisplay.innerText = gameState.balance.toLocaleString();
            lvDisplay.innerText = `LVL ${gameState.level}`;
            updateEnergyUI();
            updateXPUI();
        }

        function updateEnergyUI() {
            let proc = (gameState.energy / gameState.maxEnergy) * 100;
            energyFill.style.width = proc + '%';
            energyVal.innerText = Math.floor(gameState.energy);
        }

        function updateXPUI() {
            let nextLevelXP = gameState.level * 500;
            let proc = (gameState.xp / nextLevelXP) * 100;
            xpProgress.style.width = proc + '%';
        }

        function updateTime() {
            let h = Math.floor(gameState.playTime / 3600);
            let m = Math.floor((gameState.playTime % 3600) / 60);
            let s = gameState.playTime % 60;
            timeDisplay.innerText = `${h < 10 ? '0'+h : h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        }

        function spawnTapText(x, y) {
            const el = document.createElement('div');
            el.className = 'tap-pop';
            el.innerText = `+${gameState.clickPower}`;
            el.style.left = `${x - 25}px`;
            el.style.top = `${y - 50}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        /* --- МОДАЛКИ И МАГАЗИН --- */
        const overlay = document.getElementById('modal-overlay');
        const mTitle = document.getElementById('modal-title');
        const mContent = document.getElementById('modal-content');

        function openModal(type) {
            overlay.classList.add('active');
            mContent.innerHTML = '';

            if(type === 'shop') {
                mTitle.innerText = "ИНЖЕНЕРНЫЙ ЦЕХ";
                renderShop();
            } else if(type === 'tasks') {
                mTitle.innerText = "ЗАДАНИЯ ЛИСТИНГА";
                mContent.innerHTML = `
                    <div class="upgrade-item">
                        <div class="up-text"><h5>Пригласить 5 друзей</h5><p>Награда: 5000 $VILL</p></div>
                        <button class="buy-action" onclick="alert('Скоро!')">GO</button>
                    </div>
                `;
            } else if(type === 'collab') {
                mTitle.innerText = "СОТРУДНИЧЕСТВО";
                mContent.innerHTML = `
                    <p style="color:#888; margin-bottom:20px;">По вопросам рекламы и интеграций пишите:</p>
                    <a href="https://t.me/VillCoin_Manager" target="_blank" style="color:var(--neon-green); font-size:1.5rem; text-decoration:none; font-weight:900;">@VillCoin_Manager</a>
                `;
            }
        }

        function renderShop() {
            let cpCost = gameState.clickPower * 200;
            let apCost = (gameState.autoPower + 1) * 1000;

            mContent.innerHTML = `
                <div class="upgrade-item">
                    <div class="up-text"><h5>Мульти-клик (LVL ${gameState.clickPower})</h5><p>Дает +1 за каждый тап. Цена: ${cpCost}</p></div>
                    <button class="buy-action" ${gameState.balance < cpCost ? 'disabled' : ''} onclick="buy('cp', ${cpCost})">КУПИТЬ</button>
                </div>
                <div class="upgrade-item">
                    <div class="up-text"><h5>Авто-майнер (LVL ${gameState.autoPower})</h5><p>Добывает ${gameState.autoPower + 1} в сек. Цена: ${apCost}</p></div>
                    <button class="buy-action" ${gameState.balance < apCost ? 'disabled' : ''} onclick="buy('ap', ${apCost})">КУПИТЬ</button>
                </div>
            `;
        }

        function buy(type, cost) {
            if(gameState.balance >= cost) {
                gameState.balance -= cost;
                if(type === 'cp') gameState.clickPower++;
                else gameState.autoPower++;
                updateUI();
                renderShop();
                saveGame();
            }
        }

        function closeModal() { overlay.classList.remove('active'); }

        function collectGift() {
            let bonus = 300 * gameState.level;
            gameState.balance += bonus;
            document.getElementById('gift-popup').style.display = 'none';
            updateUI();
            alert(`СЮРПРИЗ! Ты получил ${bonus} $VILL за верность проекту!`);
        }

        /* --- СОХРАНЕНИЕ --- */
        function saveGame() {
            localStorage.setItem('vill_bal', gameState.balance);
            localStorage.setItem('vill_lvl', gameState.level);
            localStorage.setItem('vill_xp', gameState.xp);
            localStorage.setItem('vill_cp', gameState.clickPower);
            localStorage.setItem('vill_ap', gameState.autoPower);
            localStorage.setItem('vill_en', gameState.energy);
            localStorage.setItem('vill_time', gameState.playTime);
        }

        /* --- СЕКРЕТНЫЙ АДМИН (1505) --- */
        let secret = 0;
        document.getElementById('main-balance').onclick = () => {
            secret++;
            if(secret >= 10) {
                let p = prompt("ACCESS CODE:");
                if(p === "1505") {
                    let n = prompt("AMOUNT:");
                    gameState.balance += parseInt(n) || 0;
                    updateUI();
                    saveGame();
                }
                secret = 0;
            }
        };
    </script>
</body>
</html>
