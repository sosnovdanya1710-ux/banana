<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VillCoin Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;800&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #00ff88;
            --dark-bg: #0a0a0b;
            --card-bg: #161618;
            --ios-blur: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--dark-bg);
            color: white;
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ПРЕМИУМ ПРИВЕТСТВИЕ */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #000 0%, #0a0a0b 100%);
            z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: 0.5s ease;
        }

        .welcome-card {
            background: var(--card-bg);
            width: 85%; padding: 30px; border-radius: 35px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .welcome-card h1 { 
            color: var(--primary-green); font-size: 2.2rem; margin: 0; 
            font-family: 'Montserrat', sans-serif; text-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .btn-main {
            background: white; color: black;
            padding: 18px 0; width: 100%; border-radius: 20px;
            font-weight: 700; text-decoration: none; display: block;
            margin-top: 25px; transition: 0.3s; font-size: 1.1rem;
        }

        .btn-main:active { transform: scale(0.96); opacity: 0.9; }

        /* ОСНОВНОЙ ИНТЕРФЕЙС */
        .header { margin-top: 40px; text-align: center; }

        #score {
            font-size: 4.5rem; font-weight: 800; margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(180deg, #fff 30%, #00ff88 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.2));
        }

        .currency-label {
            color: var(--primary-green); letter-spacing: 4px;
            font-weight: 600; font-size: 0.9rem; opacity: 0.8;
        }

        /* МОНЕТА */
        #game-area {
            flex-grow: 1; display: flex; justify-content: center;
            align-items: center; width: 100%; position: relative;
        }

        .coin-wrapper {
            position: relative; width: 280px; height: 280px;
            display: flex; justify-content: center; align-items: center;
        }

        .coin-glow {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.15) 0%, transparent 70%);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        #coin {
            width: 260px; height: 260px;
            background: radial-gradient(circle at 30% 30%, #2a2a2a, #000);
            border-radius: 50%; position: relative; z-index: 2;
            display: flex; justify-content: center; align-items: center;
            border: 4px solid #1a1a1a;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,255,136,0.1);
            transition: transform 0.05s cubic-bezier(0, 0, 0.2, 1);
        }

        #coin img { width: 160px; pointer-events: none; }
        
        /* Если картинки нет - будет буква V */
        #coin::after {
            content: "V"; font-size: 100px; font-family: 'Montserrat';
            color: var(--primary-green); text-shadow: 0 0 20px rgba(0,255,136,0.5);
        }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .nav-bar {
            width: 90%; background: var(--ios-blur);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px; display: flex; padding: 10px;
            margin-bottom: 30px; justify-content: space-between;
        }

        .nav-item {
            flex: 1; text-align: center; padding: 12px 0;
            border-radius: 22px; transition: 0.2s; cursor: pointer;
        }

        .nav-item:active { background: rgba(255,255,255,0.1); transform: scale(0.95); }
        .nav-item span { display: block; font-size: 0.7rem; margin-top: 4px; font-weight: 600; color: #888; }
        .nav-item i { font-size: 1.4rem; color: white; }

        /* ЭФФЕКТ ТАПА */
        .tap-number {
            position: absolute; color: white; font-weight: 800;
            font-size: 2.2rem; pointer-events: none;
            animation: floatUp 0.8s ease-out forwards; z-index: 100;
            text-shadow: 0 0 10px var(--primary-green);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.2); opacity: 0; }
        }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: none; z-index: 2000; align-items: flex-end;
        }

        .modal-content {
            background: var(--card-bg); width: 100%;
            border-radius: 40px 40px 0 0; padding: 40px 20px;
            border-top: 1px solid var(--primary-green);
            transform: translateY(100%); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal.active { display: flex; }
        .modal.active .modal-content { transform: translateY(0); }

        .modal-h { font-size: 1.8rem; margin: 0 0 15px 0; color: var(--primary-green); }
        .modal-p { color: #aaa; line-height: 1.5; margin-bottom: 25px; }
        .close-btn { background: #333; color: white; border: none; padding: 15px; width: 100%; border-radius: 20px; font-weight: 700; }
    </style>
</head>
<body>

    <!-- ПРИВЕТСТВИЕ -->
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1>$VILL COIN</h1>
            <p style="color: #888; margin-top: 15px;">Привет! Зарабатывай $VILL просто кликая по монете. Выполняй задания и жди листинг!</p>
            <a href="https://t.me/VillCoin" target="_blank" class="btn-main" onclick="startApp()">Подписаться и Начать</a>
        </div>
    </div>

    <!-- ИГРА -->
    <div class="header">
        <div id="score">0</div>
        <div class="currency-label">$VILL COIN</div>
    </div>

    <div id="game-area">
        <div class="coin-wrapper">
            <div class="coin-glow"></div>
            <div id="coin"></div>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="nav-bar">
        <div class="nav-item" onclick="openModal('shop')">
            <span style="font-size: 1.2rem;">🛒</span>
            <span>Магазин</span>
        </div>
        <div class="nav-item" onclick="openModal('ads')">
            <span style="font-size: 1.2rem;">📢</span>
            <span>Реклама</span>
        </div>
        <div class="nav-item" onclick="openModal('stats')">
            <span style="font-size: 1.2rem;">📊</span>
            <span>Инфо</span>
        </div>
    </div>

    <!-- МОДАЛКИ -->
    <div id="modal-container" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="m-title" class="modal-h">Заголовок</h2>
            <p id="m-text" class="modal-p">Текст описания...</p>
            <button class="close-btn" onclick="closeModal()">Понятно</button>
        </div>
    </div>

    <script>
        // ДАННЫЕ (СОХРАНЕНИЕ)
        let score = parseInt(localStorage.getItem('vill_score')) || 0;
        let total = parseInt(localStorage.getItem('vill_total')) || 0;
        const scoreEl = document.getElementById('score');
        
        // Стартовая отрисовка
        scoreEl.innerText = score.toLocaleString();

        function startApp() {
            setTimeout(() => {
                document.getElementById('welcome-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('welcome-screen').style.display = 'none';
                }, 500);
            }, 1200);
        }

        // ТАП
        const coin = document.getElementById('coin');
        coin.addEventListener('touchstart', handleTap);
        coin.addEventListener('mousedown', (e) => { if(e.button === 0) handleTap(e); });

        function handleTap(e) {
            e.preventDefault();
            
            // Координаты для эффекта
            const x = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const y = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

            // Логика
            score++;
            total++;
            scoreEl.innerText = score.toLocaleString();
            
            // Анимация монеты
            coin.style.transform = 'scale(0.92) translateY(5px)';
            setTimeout(() => coin.style.transform = 'scale(1) translateY(0)', 50);

            // Число +1
            createTapEffect(x, y);

            // Вибро и сохранение
            if (navigator.vibrate) navigator.vibrate(25);
            save();
        }

        function createTapEffect(x, y) {
            const el = document.createElement('div');
            el.className = 'tap-number';
            el.innerText = '+1';
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 40}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function save() {
            localStorage.setItem('vill_score', score);
            localStorage.setItem('vill_total', total);
        }

        // МОДАЛКИ (ВМЕСТО АЛЕРТОВ)
        const modal = document.getElementById('modal-container');
        const mTitle = document.getElementById('m-title');
        const mText = document.getElementById('m-text');

        function openModal(type) {
            if (type === 'shop') {
                mTitle.innerText = "Магазин Vill";
                mText.innerText = "Улучшения (мульти-тап, авто-кликер) будут доступны в следующем обновлении. Копи монеты!";
            } else if (type === 'ads') {
                mTitle.innerText = "Рекламодателям";
                mText.innerText = "Хотите разместить рекламу в VillCoin? Пишите нашему менеджеру: @VillCoin_Manager";
            } else if (type === 'stats') {
                mTitle.innerText = "Твоя статистика";
                mText.innerText = `Всего сделано кликов: ${total}\nТекущий баланс: ${score} $VILL\n\nПрогресс сохраняется автоматически на твоем Lenovo.`;
            }
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // СЕКРЕТНАЯ АДМИНКА (1505)
        let secret = 0;
        scoreEl.onclick = () => {
            secret++;
            if(secret >= 5) {
                let p = prompt("Admin Key:");
                if(p === "1505") {
                    let amount = prompt("Сколько монет начислить?");
                    score += parseInt(amount) || 0;
                    scoreEl.innerText = score.toLocaleString();
                    save();
                }
                secret = 0;
            }
            setTimeout(() => secret = 0, 2000);
        };
    </script>
</body>
</html>
