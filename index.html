<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VillCoin - Тапай и зарабатывай</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        .btn-sub {
            background: #0088cc;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.5);
        }

        #score-container {
            margin-top: 50px;
            text-align: center;
        }

        #score {
            font-size: 4rem;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            color: #ffd700;
            cursor: pointer;
        }

        #coin-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        #coin {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #ffd700, #b8860b);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(184, 134, 11, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: transform 0.05s ease-out;
            border: 10px solid #daa520;
        }

        #coin span {
            font-size: 8rem;
            font-weight: 900;
            color: #daa520;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .footer-btns {
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding-bottom: 30px;
        }

        .btn-footer {
            background: rgba(255,255,255,0.1);
            padding: 12px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #toast {
            position: fixed;
            bottom: 100px;
            background: #4caf50;
            padding: 10px 20px;
            border-radius: 20px;
            display: none;
            animation: fadeInUp 0.3s;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <h1>VILL COIN</h1>
        <p>Подпишись на канал, чтобы начать играть!</p>
        <a href="https://t.me/VillCoin" target="_blank" class="btn-sub" onclick="checkSub()">ПОДПИСАТЬСЯ</a>
    </div>

    <div id="score-container">
        <div id="score">0</div>
        <p style="color: #888;">$VILL COINS</p>
    </div>

    <div id="coin-container">
        <div id="coin" onclick="tap(event)">
            <span>V</span>
        </div>
    </div>

    <div id="toast">Бонус +50 коинов!</div>

    <div class="footer-btns">
        <button class="btn-footer" onclick="alert('Скоро: Магазин улучшений!')">МАГАЗИН</button>
        <button class="btn-footer" onclick="showAds()">РЕКЛАМА</button>
    </div>

    <script>
        // --- ЛОГИКА ИГРЫ ---
        
        // 1. Загрузка прогресса из памяти (чтобы ничего не пропадало)
        let score = parseInt(localStorage.getItem('vill_score')) || 0;
        let clicks = 0;
        let totalTaps = parseInt(localStorage.getItem('vill_total_taps')) || 0;

        const scoreEl = document.getElementById('score');
        scoreEl.innerText = score;

        // 2. Вход после подписки
        function checkSub() {
            setTimeout(() => {
                document.getElementById('welcome-screen').style.display = 'none';
            }, 1000);
        }

        // 3. Тап по монете
        function tap(event) {
            score++;
            clicks++;
            totalTaps++;
            updateUI();

            // Анимация нажатия
            const coin = document.getElementById('coin');
            coin.style.transform = 'scale(0.95) rotateX(10deg)';
            setTimeout(() => coin.style.transform = 'scale(1) rotateX(0)', 50);

            // Бонус за 100 кликов
            if (clicks >= 100) {
                score += 50;
                clicks = 0;
                showToast();
            }

            // Вибрация (для мобилок)
            if (navigator.vibrate) navigator.vibrate(40);

            // Авто-сохранение в память устройства
            saveData();
        }

        function updateUI() {
            scoreEl.innerText = score;
        }

        function saveData() {
            localStorage.setItem('vill_score', score);
            localStorage.setItem('vill_total_taps', totalTaps);
        }

        // 4. СЕКРЕТНАЯ АДМИНКА (пароль 1505)
        let adminCounter = 0;
        scoreEl.onclick = function() {
            adminCounter++;
            if (adminCounter >= 5) {
                let pass = prompt("Введите пароль владельца:");
                if (pass === "1505") {
                    alert(`📊 АДМИНКА VillCoin\n\nТвой баланс: ${score}\nВсего кликов: ${totalTaps}\nСохранение: АКТИВНО`);
                }
                adminCounter = 0;
            }
            setTimeout(() => adminCounter = 0, 2000);
        };

        // 5. Рекламный контакт
        function showAds() {
            alert('Сотрудничество и реклама: @VillCoin_Manager \nПишите для размещения!');
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }
    </script>
</body>
</html>
