<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Профиль</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; text-align: center; width: 80%; max-width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { margin: 10px 0; font-size: 24px; }
        p { color: #aaa; }
        .btn { display: block; background: #5865F2; color: white; padding: 10px; margin-top: 15px; border-radius: 8px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Твой Профиль</h1>
        <p>Добро пожаловать в личный кабинет</p>
        <div class="btn">ID: 12345678</div>
    </div>

</body>
</html>
