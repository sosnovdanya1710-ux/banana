<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banana Clicker - VillCoin Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e; /* Тот самый темный фон */
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #score-container {
            margin-top: 50px;
            text-align: center;
        }

        #score {
            font-size: 80px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        #currency-name {
            color: #888;
            font-size: 20px;
            margin-top: 10px;
        }

        #coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        #coin {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #ffd700, #b8860b);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            transition: transform 0.05s ease;
            border: 8px solid #daa520;
        }

        #coin:active {
            transform: scale(0.95);
        }

        #coin span {
            font-size: 120px;
            font-weight: bold;
            color: #daa520;
        }

        .footer {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .btn {
            background-color: #2a2a4e;
            border: 1px solid #444;
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Окно подписки */
        #sub-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .sub-btn {
            background: #0088cc;
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div id="sub-screen">
        <h1 style="margin-bottom: 10px;">VILL COIN</h1>
        <p style="margin-bottom: 30px; color: #ccc;">Подпишись, чтобы играть</p>
        <a href="https://t.me/VillCoin" target="_blank" class="sub-btn" onclick="closeSub()">ПОДПИСАТЬСЯ</a>
    </div>

    <div id="score-container">
        <div id="score" onclick="openAdmin()">0</div>
        <div id="currency-name">$VILL COINS</div>
    </div>

    <div id="coin-container">
        <div id="coin" onclick="tap()">
            <span>V</span>
        </div>
    </div>

    <div class="footer">
        <button class="btn" onclick="alert('Скоро!')">МАГАЗИН</button>
        <button class="btn" onclick="showAds()">РЕКЛАМА</button>
    </div>

    <script>
        // Загрузка и сохранение
        let score = parseInt(localStorage.getItem('vill_score')) || 0;
        let total = parseInt(localStorage.getItem('vill_total')) || 0;
        document.getElementById('score').innerText = score;

        function closeSub() {
            setTimeout(() => {
                document.getElementById('sub-screen').style.display = 'none';
            }, 1000);
        }

        function tap() {
            score++;
            total++;
            document.getElementById('score').innerText = score;
            localStorage.setItem('vill_score', score);
            localStorage.setItem('vill_total', total);
            if (navigator.vibrate) navigator.vibrate(40);
        }

        function showAds() {
            alert('Сотрудничество: @VillCoin_Manager');
        }

        let clicks = 0;
        function openAdmin() {
            clicks++;
            if(clicks >= 5) {
                let p = prompt("Пароль:");
                if(p === "1505") alert("Стата: " + total + " кликов всего.");
                clicks = 0;
            }
            setTimeout(() => clicks = 0, 2000);
        }
    </script>
</body>
</html>
